version: '3.8'

services:
  app:
    build: .
    container_name: comparei-servico-logs
    ports:
      - "8081:8081"
    depends_on:
      - db
    networks:
      - net_logs
      - comparei_net
    command: ["./wait-for-it.sh", "db:3306", "--", "./main"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
  db:
    image: mysql:8
    container_name: mysql_logs
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: logsdb
    volumes:
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - net_logs
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
          
networks:
  net_logs:
    driver: bridge
  
  comparei_net:
    external: true
